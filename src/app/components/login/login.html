<div class="login-container">
    <div class="login-wrapper">
        <div class="login-card">
            <!-- Header -->
            <div class="login-header">
                <div class="login-logo">
                    <i class="bi bi-shield-lock"></i>
                </div>
                <h2 class="login-title">Welcome Back</h2>
                <p class="login-subtitle">Sign in to your account</p>
            </div>

            <!-- Form -->
            <form class="login-form">
                <!-- Email Field -->
                <div class="form-group mb-4">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input type="email" class="form-control form-control-lg" id="email"
                            placeholder="Enter your email" required />
                    </div>
                    <small class="form-text text-muted">We'll never share your email.</small>
                </div>

                <!-- Password Field -->
                <div class="form-group mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" class="form-control form-control-lg" id="password"
                            placeholder="Enter your password" required />
                    </div>
                </div>

                <!-- Remember & Forgot -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember" />
                        <label class="form-check-label" for="remember">
                            Remember me
                        </label>
                    </div>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <!-- Login Button -->
                <button type="submit" class="btn btn-login btn-lg w-100 mb-3">
                    <i class="bi bi-box-arrow-in-right"></i> Sign In
                </button>

                <!-- Divider -->
                <div class="divider-container mb-3">
                    <hr class="divider" />
                    <span class="divider-text">OR</span>
                    <hr class="divider" />
                </div>

                <!-- Social Login -->
                <div class="social-login">
                    <button type="button" class="btn btn-social btn-outline-primary w-100 mb-2">
                        <i class="bi bi-google"></i> Google
                    </button>
                    <button type="button" class="btn btn-social btn-outline-primary w-100">
                        <i class="bi bi-github"></i> GitHub
                    </button>
                </div>
            </form>

            <!-- Footer -->
            <div class="login-footer">
                <p class="text-center mb-0">
                    Don't have an account?
                    <a href="#" class="signup-link">Sign Up</a>
                </p>
            </div>
        </div>
    </div>
</div>
