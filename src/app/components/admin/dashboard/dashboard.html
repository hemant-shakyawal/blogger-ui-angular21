<div class="dashboard-container">
    <!-- Header -->
    <header class="dashboard-header">
        <div class="header-content">
            <button class="btn-toggle-sidebar" (click)="toggleSidebar()" [class.active]="sidebarOpen()">
                <i class="bi bi-list"></i>
            </button>
            <h1 class="header-title">Dashboard</h1>
        </div>
        <div class="header-actions">
            <button class="btn btn-light btn-sm">
                <i class="bi bi-bell"></i>
            </button>
            <button class="btn btn-light btn-sm">
                <i class="bi bi-person-circle"></i>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="dashboard-main">
        <!-- Sidebar -->
        <aside class="dashboard-sidebar" [class.collapsed]="!sidebarOpen()">
            <div class="sidebar-header">
                <h4 class="sidebar-title">
                    <i class="bi bi-speedometer2"></i>
                    <span>Admin Panel</span>
                </h4>
                <button class="btn-close-sidebar" (click)="toggleSidebar()" *ngIf="sidebarOpen()">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Main</div>
                    <ul class="nav-menu">
                        <li>
                            <a href="#" class="nav-link active">
                                <i class="bi bi-house-door"></i>
                                <span>Home</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="nav-link">
                                <i class="bi bi-graph-up"></i>
                                <span>Analytics</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="nav-link">
                                <i class="bi bi-file-earmark-text"></i>
                                <span>Posts</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="nav-link">
                                <i class="bi bi-tag"></i>
                                <span>Categories</span>
                            </a>
                        </li>
                    </ul>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">Management</div>
                    <ul class="nav-menu">
                        <li>
                            <a href="#" class="nav-link">
                                <i class="bi bi-people"></i>
                                <span>Users</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="nav-link">
                                <i class="bi bi-shield-check"></i>
                                <span>Permissions</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="nav-link">
                                <i class="bi bi-gear"></i>
                                <span>Settings</span>
                            </a>
                        </li>
                    </ul>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">Extras</div>
                    <ul class="nav-menu">
                        <li>
                            <a href="#" class="nav-link">
                                <i class="bi bi-question-circle"></i>
                                <span>Help</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="nav-link">
                                <i class="bi bi-box-arrow-right"></i>
                                <span>Logout</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>
        </aside>

        <!-- Content -->
        <main class="dashboard-content">
            <div class="content-wrapper">
                <router-outlet></router-outlet>
            </div>
        </main>
    </div>
</div>
