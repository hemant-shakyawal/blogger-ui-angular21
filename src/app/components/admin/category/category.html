<div class="container-fluid py-4">
    <div class="row mb-4">
        <div class="col-md-8">
            <h2 class="mb-0">Categories</h2>
        </div>
        <div class="col-md-4 text-end">
            <button class="btn btn-primary" routerLink="../add-category">
                <i class="bi bi-plus-circle"></i> Add Category
            </button>
        </div>
    </div>

    @if(isLodading()){
    <div class="d-flex justify-content-center py-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    }@else{
    @if(isError()){
    <div class="alert alert-danger" role="alert">
        Error loading categories: {{ isError()?.message }}
    </div>
    }@else{


    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th scope="col" class="ps-4">ID</th>
                            <th scope="col">Name</th>
                            <th scope="col">URL Handle</th>
                            <th scope="col" class="text-end pe-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        @for(category of values(); track category.id){

                        <tr class="align-middle">
                            <th scope="row" class="ps-4">{{ category.id }}</th>
                            <td>
                                <span class="badge bg-info text-dark">{{ category.name }}</span>
                            </td>
                            <td>
                                <code class="text-muted">{{ category.urlHandle }}</code>
                            </td>
                            <td class="text-end pe-4">
                                <button class="btn btn-sm btn-outline-primary me-2">
                                    <i class="bi bi-pencil"></i> Edit
                                </button>
                                <button class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i> Delete
                                </button>
                            </td>
                        </tr>}
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    }
    }

</div>
