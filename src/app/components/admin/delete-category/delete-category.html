<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0">Delete Category</h5>
                </div>
                <div class="card-body">
                    <p class="text-muted">You're about to delete this category. This action cannot be undone.</p>

                    <div class="mb-3">
                        <label class="form-label">ID</label>
                        <input type="text" class="form-control" [value]="id" disabled />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Category Name</label>
                        <input type="text" class="form-control" [value]="category()?.name || ''" disabled />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">URL Handle</label>
                        <div class="input-group">
                            <span class="input-group-text">/</span>
                            <input type="text" class="form-control" [value]="category()?.urlHandle || ''" disabled />
                        </div>
                    </div>

                    <div class="alert alert-warning" role="alert">
                        <strong>Warning:</strong> Deleting a category will remove it from all posts that use it.
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
                        <button type="button" class="btn btn-danger" (click)="onDelete()">Delete permanently</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
