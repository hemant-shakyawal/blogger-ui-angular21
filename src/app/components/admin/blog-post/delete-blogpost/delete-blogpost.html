<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0">Delete Blog Post</h5>
                </div>
                <div class="card-body">
                    <p class="text-muted">You're about to delete this blog post. This action cannot be undone.</p>

                    <div class="mb-3">
                        <label class="form-label">ID</label>
                        <input type="text" class="form-control" [value]="id" disabled />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" class="form-control" [value]="blogpost()?.title || ''" disabled />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">URL Handle</label>
                        <div class="input-group">
                            <span class="input-group-text">/blog/post/</span>
                            <input type="text" class="form-control" [value]="blogpost()?.urlHandle || ''" disabled />
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Publish Date</label>
                        <input type="text" class="form-control" [value]="blogpost()?.publishDate | date: 'MMM d, yyyy'"
                            disabled />

                    </div>

                    <div class="alert alert-warning" role="alert">
                        <strong>Warning:</strong> Deleting this blog post will remove it permanently.
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <button type="button" class="btn btn-secondary" (click)="onCancel()"
                            [disabled]="isDeleting">Cancel</button>
                        <button type="button" class="btn btn-danger" (click)="onDelete()" [disabled]="isDeleting">Delete
                            permanently</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
